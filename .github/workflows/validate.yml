name: Validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --only-binary=:all: 'torch>=2.6,<3'
          --index-url https://download.pytorch.org/whl/cpu
      - run: >-
          python -m pip install --only-binary=:all: -e '.[dev,report]'
      - run: ruff check . && ruff format --check .
      - name: CPU-only framework and owned-runtime regression checks
        run: |
          python -I -S -B -m unittest discover -s validation/upstream-pytorch-pristine-v1 -p 'test_*.py'
          python -I -S -B -m unittest discover -s validation/upstream-pytorch-paired-v1 -p 'test_*.py'
          python -I -S -B -m unittest discover -s validation/owned-pytorch-layout-v1 -p 'test_*.py'
          python -I -S -B -m unittest discover -s validation/owned-pytorch-half-v1 -p 'test_*.py'
          python -I -S -B -m unittest discover -s validation/owned-pytorch-half-v2 -p 'test_*.py'
          python -I -S -B -m unittest discover -s validation/owned-pytorch-half-v3 -p 'test_*.py'
          python -I -S -B -m unittest discover -s validation/trained-precision-hosted -p 'test_*.py'
          # Keep import-isolation checks in fresh processes. Array-audit tests
          # use installed NumPy; no test here executes a GPU framework.
          for test_file in integration/gpu-owned/test_*.py; do
            python -I -B -m unittest discover -s integration/gpu-owned -p "$(basename "$test_file")"
          done
          python -I -S -B -m unittest discover -s integration/gpu-owned/half-index-candidate-v1 -p 'test_*.py'
      - name: Reference checks at every model width
        run: |
          for width in 32 64 128 256 512 1024; do
            ARM64_TRANSFORMER_WIDTH=$width python -m pytest -q
          done
  native:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: test "$(uname -m)" = arm64
      - run: >-
          python -m pip install --only-binary=:all: -e '.[dev,report]'
      - run: make -C native widths PYTHON=python
      - name: Compile Metal host bridge (device tests require explicit GPU access)
        run: make -C native/metal
      - name: Check Metal cleanup ownership with a mocked Context
        run: python native/metal/check_close.py --output work/metal-close-ci
      - name: Numerical and executable checks at every width and supported backend
        run: |
          for width in 32 64 128 256 512 1024; do
            export ARM64_TRANSFORMER_WIDTH=$width
            export ARM64_TRANSFORMER_BACKEND=auto
            python -m pytest -q
            python -m transformer.validate --output results/width-$width.json \
              --runtime --work-dir results/smoke-width-$width
            ARM64_TRANSFORMER_BACKEND=neon python -m transformer.validate \
              --output results/width-$width-neon.json \
              --runtime --work-dir results/smoke-width-$width-neon
            supported=$(python -c "import json; print(json.load(open('results/width-$width.json'))['backend']['sme_supported'])")
            if [ "$supported" = 1 ]; then
              ARM64_TRANSFORMER_BACKEND=sme python -m transformer.validate \
                --output results/width-$width-sme.json \
                --runtime --work-dir results/smoke-width-$width-sme
            else
              echo "Width $width: SME unsupported; auto/NEON gates cover clean forced-SME rejection."
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-preflight
          path: results/
          retention-days: 30
