name: Validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install --only-binary=:all: 'torch>=2.6,<3'
          --index-url https://download.pytorch.org/whl/cpu
      - run: >-
          python -m pip install --only-binary=:all: -e '.[dev,report]'
      - run: ruff check . && ruff format --check .
      - name: Reference checks at every model width
        run: |
          for width in 32 64 128 256; do
            ARM64_TRANSFORMER_WIDTH=$width python -m pytest -q
          done
  native:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: test "$(uname -m)" = arm64
      - run: >-
          python -m pip install --only-binary=:all: -e '.[dev,report]'
      - run: make -C native widths PYTHON=python
      - name: Numerical and executable checks at every width
        run: |
          for width in 32 64 128 256; do
            export ARM64_TRANSFORMER_WIDTH=$width
            python -m pytest -q
            python -m transformer.validate --output results/width-$width.json \
              --runtime --work-dir results/smoke-width-$width
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-preflight
          path: results/
          retention-days: 30
